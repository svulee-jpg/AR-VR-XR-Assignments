<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E2 / E3 helper - original Ch. 8 texture-loader</title>
  <!--
    NOT part of the graded project and NOT included in the ZIP.
    It contains the Chapter 8 "texture-loader" component (re-typed from the chapter listing)
    so that experiments E2(a) and E3 can be run on the ORIGINAL code.
    Open it through the local server:  http://localhost:8000/notes/ch8-original.html
  -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    // Ch. 8 component, as in the book: runtime objects are stored in the schema (this.data.*).
    AFRAME.registerComponent('texture-loader', {
      schema: {
        src: {},
        material_tex: {},
        mesh: {},
        texture: {}
      },
      init: function () {
        console.log('initialized');
      },
      update: function () {
        this.data.texture = new THREE.TextureLoader().load(this.data.src);
        this.data.texture.anisotropy = 16;
        this.data.texture.minFilter = THREE.NearestFilter;
        this.data.texture.maxFilter = THREE.NearestFilter;
        this.data.material_tex = new THREE.MeshLambertMaterial({map: this.data.texture});
        const el = this.el;
        this.data.mesh = el.getObject3D('mesh');
        this.data.mesh.material = this.data.material_tex;
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <a-entity light="type: ambient; intensity: 2"></a-entity>
    <a-entity light="type: directional; intensity: 2" position="-1 3 2"></a-entity>
    <a-sky color="#bcd4e6"></a-sky>
    <!-- Original usage from the chapter: component attached to a box -->
    <a-box id="ch8box" texture-loader="src: ../textures/wood.jpg" position="0 1.5 -2"></a-box>
    <a-entity camera look-controls position="0 1.6 0"></a-entity>
  </a-scene>
</body>
</html>
